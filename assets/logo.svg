<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Vector source of the Dynamic Island logo. scripts/make-icon.ps1 draws the
       same shapes (tile corners: 70 px span, control points 0.76 of it). -->
  <defs>
    <linearGradient id="tile-fill" x1="0" y1="12" x2="0" y2="244" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2A2A2E"/>
      <stop offset="1" stop-color="#0E0E10"/>
    </linearGradient>
    <path id="tile" d="M82 12 H174 C227.2 12 244 28.8 244 82 V174 C244 227.2 227.2 244 174 244 H82 C28.8 244 12 227.2 12 174 V82 C12 28.8 28.8 12 82 12 Z"/>
    <clipPath id="tile-clip"><use href="#tile"/></clipPath>
  </defs>
  <use href="#tile" fill="url(#tile-fill)"/>
  <!-- 2 px inner hairline: a 4 px stroke clipped to the tile. -->
  <use href="#tile" fill="none" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="4" clip-path="url(#tile-clip)"/>
  <rect x="60" y="60" width="136" height="44" rx="22" fill="#FFFFFF"/>
  <circle cx="174" cy="82" r="10" fill="#4F8CFF"/>
</svg>
