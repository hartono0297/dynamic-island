<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rencana v3.1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400;1,9..144,500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F1ECE4; --ink: #221A14; --ink2: #7A6B5D; --rule: #DDD3C6; --card: #FBF7F1;
    --s: #17120F; --r: #241D18; --t: #332A23; --tx: #F4EDE4; --tx2: #A89A8B;
    --a: #E2683C; --sage: #9DB59A; --ochre: #D9A441; --plum: #B07A9A; --clay: #C9826B;
    --disp: 'Fraunces', serif; --body: 'DM Sans', sans-serif; --mono: 'DM Mono', monospace;
  }
  @page { size: 297mm 210mm; margin: 0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #9a948c; }
  body { font-family: var(--body); color: var(--ink); -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .page { width: 297mm; height: 210mm; overflow: hidden; position: relative; margin: 0 auto 16px; padding: 30px 40px; background: var(--paper); break-after: page; }
  .page.dark { background: var(--s); color: var(--tx); }
  @media print { html, body { background: none; } .page { margin: 0; } }
  svg { display: block; }
  .folio { position: absolute; left: 40px; right: 40px; bottom: 16px; display: flex; justify-content: space-between; font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase; opacity: .5; }
  .eyebrow { font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; font-weight: 600; color: var(--ink2); }
  .dark .eyebrow { color: var(--tx2); }
  h1 { font-family: var(--disp); font-style: italic; font-weight: 500; font-size: 30px; letter-spacing: -.01em; margin: 2px 0 14px; }
  .lbl { font-size: 10px; letter-spacing: .1em; text-transform: uppercase; font-weight: 600; color: var(--ink2); margin-bottom: 6px; }
  code, .mono { font-family: var(--mono); font-size: 10px; }
  code { background: #E8E0D4; padding: 0 4px; border-radius: 4px; }

  /* cover */
  .cv { display: flex; flex-direction: column; justify-content: space-between; height: calc(100% - 26px); }
  .cv .big { font-family: var(--disp); font-style: italic; font-weight: 500; font-size: 60px; line-height: 1.02; letter-spacing: -.02em; }
  .cv .sub { color: var(--tx2); font-size: 15px; line-height: 1.5; max-width: 560px; margin-top: 14px; }
  .phases { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; }
  .phases div { border-top: 2px solid var(--t); padding-top: 10px; font-size: 11px; color: var(--tx2); line-height: 1.4; }
  .phases b { display: block; color: var(--tx); font-family: var(--disp); font-style: italic; font-weight: 500; font-size: 16px; margin-bottom: 2px; }
  .phases span { display: inline-block; font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--a); font-weight: 600; margin-bottom: 4px; }

  /* overview cards */
  .ov { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .oc { background: var(--card); border: 1px solid var(--rule); border-radius: 16px; overflow: hidden; }
  .oc .im { height: 150px; background-size: cover; background-position: center top; border-bottom: 1px solid var(--rule); }
  .oc .tx { padding: 10px 13px 12px; }
  .oc b { font-family: var(--disp); font-style: italic; font-weight: 500; font-size: 17px; display: block; }
  .oc p { font-size: 10.5px; color: var(--ink2); line-height: 1.45; margin-top: 3px; }
  .oc .fr { font-size: 10px; margin-top: 6px; color: #3E3229; }
  .oc .fr s { color: var(--ink2); }

  /* roadmap */
  .road { position: relative; margin-top: 6px; }
  .rrow { display: grid; grid-template-columns: 120px 1fr 92px 230px; gap: 14px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--rule); }
  .rrow .ph { font-size: 10px; letter-spacing: .1em; text-transform: uppercase; font-weight: 600; color: var(--ink2); }
  .rrow .nm { display: flex; align-items: center; gap: 10px; }
  .rrow .nm i { width: 30px; height: 30px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-style: normal; font-weight: 600; font-size: 11px; color: #17120F; flex: none; }
  .rrow .nm b { font-size: 12.5px; font-weight: 500; }
  .rrow .nm small { display: block; font-size: 10.5px; color: var(--ink2); }
  .size { font-size: 10px; padding: 3px 9px; border-radius: 99px; background: #E6DCCF; justify-self: start; }
  .size.l { background: rgba(226,104,60,.18); color: #A8431F; }
  .dep { font-size: 10.5px; color: var(--ink2); }

  /* run cards */
  .runs { display: grid; gap: 14px; }
  .runs.c2 { grid-template-columns: 1fr 1fr; }
  .runs.c3 { grid-template-columns: 1fr 1fr 1fr; }
  .run { background: var(--card); border: 1px solid var(--rule); border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; }
  .run .rh { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .run .rh i { width: 32px; height: 32px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-style: normal; font-weight: 600; font-size: 11.5px; color: #17120F; flex: none; }
  .run .rh b { font-family: var(--disp); font-style: italic; font-weight: 500; font-size: 18px; line-height: 1.1; }
  .run .rh .size { margin-left: auto; }
  .run ul { margin: 2px 0 8px; }
  .run li { list-style: none; position: relative; padding-left: 13px; font-size: 10.8px; line-height: 1.45; margin-bottom: 3px; color: #3E3229; }
  .run li::before { content: ""; position: absolute; left: 0; top: 6px; width: 5px; height: 5px; border-radius: 50%; background: var(--a); }
  .files { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
  .files span { font-family: var(--mono); font-size: 9.5px; background: #EDE5DA; border-radius: 6px; padding: 2px 6px; color: #4A3D33; }
  .done { font-size: 10.5px; background: rgba(157,181,154,.18); border-radius: 10px; padding: 7px 10px; color: #3F5A3C; line-height: 1.45; margin-top: auto; }
  .done b { font-weight: 600; }
  .args { background: var(--s); color: var(--tx); border-radius: 10px; padding: 8px 10px; font-family: var(--mono); font-size: 9.5px; line-height: 1.5; margin-top: 8px; }
  .args span { color: var(--a); }
  .thumbs { display: grid; gap: 10px; }
  .thumbs img { width: 100%; display: block; border-radius: 10px; border: 1px solid var(--rule); }
  .thumbs .cap { font-size: 9.5px; color: var(--ink2); margin-top: 3px; }
  .split { display: grid; grid-template-columns: 1fr 300px; gap: 18px; }

  /* tables */
  table { width: 100%; border-collapse: collapse; font-size: 11px; }
  th, td { text-align: left; padding: 7px 9px; border-bottom: 1px solid var(--rule); vertical-align: top; line-height: 1.45; }
  th { font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink2); font-weight: 600; }
  .steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .stp { background: var(--card); border: 1px solid var(--rule); border-radius: 14px; padding: 12px 14px; }
  .stp .k { font-size: 9.5px; letter-spacing: .12em; text-transform: uppercase; font-weight: 600; color: var(--a); }
  .stp b { display: block; font-size: 13px; margin: 3px 0 4px; }
  .stp p { font-size: 10.5px; line-height: 1.45; color: #4A3D33; }

  h1, .cv .big, .phases b, .oc b, .run .rh b { font-family: 'DM Sans', sans-serif !important; font-style: normal !important; font-weight: 700 !important; letter-spacing: -.02em; }
  .rrow { padding: 3px 0 !important; }
  .rrow .nm i { width: 24px !important; height: 24px !important; font-size: 10px !important; }
  .rrow .nm b { font-size: 11.5px !important; }
</style>
</head>
<body>
<div id="doc"></div>
<script>
const SQ = 'M82 12H174C227.2 12 244 28.8 244 82V174C244 227.2 227.2 244 174 244H82C28.8 244 12 227.2 12 174V82C12 28.8 28.8 12 82 12Z';
const robot = (s) => `<svg width="${s}" height="${s}" viewBox="0 0 64 64"><rect x="6" y="9" width="52" height="46" rx="18" fill="#E2683C"/><rect x="12" y="21" width="40" height="22" rx="11" fill="#17120F"/><path d="M20.5 34q4-6 8 0M35.5 34q4-6 8 0" fill="none" stroke="#F4EDE4" stroke-width="2.6" stroke-linecap="round"/></svg>`;
const PC = { 0: '#C9BBA8', 1: '#E2683C', 2: '#D9A441', 3: '#9DB59A', 4: '#B07A9A', 5: '#A3A55A', 6: '#C9826B' };
const folio = (r) => `<div class="folio"><span>Dynamic Island · Rencana v3.1</span><span>${r}</span></div>`;
const PLAN = 'rencana v3.1';

const RUNS = [
  { id: 'F0', ph: 0, name: 'Persiapan', sub: 'Pull, preflight di PC baru, baseline test', size: 'S', dep: 'Manual, bukan workflow' },
  { id: '1', ph: 1, name: 'Judul tegak (DM Sans 600)', sub: 'Fraunces dikeluarkan dari exe', size: 'M', dep: 'Setelah F0 · duluan, menyentuh semua gambar' },
  { id: '2', ph: 1, name: 'Lirik melebar', sub: '220–560 px, bergeser kalau lebih', size: 'S', dep: 'Setelah Run 1 (boleh tukar dengan Run 3)' },
  { id: '3', ph: 2, name: 'CLI ikut folder Explorer', sub: 'Chip + menu folder, favorit, riwayat', size: 'M', dep: 'Setelah Run 1' },
  { id: '4', ph: 3, name: 'Halaman Sistem (monitor)', sub: 'CPU, RAM, disk, proses, peringatan', size: 'M', dep: 'Setelah Run 1' },
  { id: '5', ph: 3, name: 'Deep clean · Pilih sendiri', sub: 'Mesin island, kategori, Recycle Bin', size: 'L', dep: 'Setelah Run 4' },
  { id: '6', ph: 3, name: 'Deep clean · Otomatis Mole', sub: 'Pratinjau, konfirmasi, log, hasil diukur', size: 'L', dep: 'Setelah Run 5' },
  { id: '7', ph: 4, name: 'Clipboard sendiri', sub: 'Riwayat 50 item, halaman panel', size: 'L', dep: 'Setelah Run 1' },
  { id: '8', ph: 4, name: 'Screenshot + preview', sub: 'Salin lagi / Simpan / Hapus di notch', size: 'M', dep: 'Setelah Run 7' },
  { id: '9', ph: 5, name: 'Sembilan halaman + pengaturan', sub: 'Urutan, sembunyikan halaman', size: 'S', dep: 'Setelah Run 4 & 7' },
  { id: '10', ph: 5, name: 'Teks, screenshot, versi 3.1.0', sub: 'i18n, README, kredit Mole, memori', size: 'S', dep: 'Paling akhir (setelah Run 14)' },
  { id: '11', ph: 6, name: 'Fix: musik ter-pause sendiri', sub: 'Log diagnosis + klik aman + sesi yang benar', size: 'S', dep: 'Paling awal, setelah F0' },
  { id: '12', ph: 6, name: 'Ganti nama ke Vale', sub: 'Exe, folder data + migrasi, installer', size: 'M', dep: 'Setelah Run 9' },
  { id: '13', ph: 6, name: 'Maskot kucing + logo bertelinga', sub: 'Varian B dengan pita', size: 'M', dep: 'Setelah Run 12' },
  { id: '14', ph: 6, name: 'Login Google satu klik', sub: 'Client bawaan, Lanjutan tetap ada', size: 'S', dep: 'Setelah Run 13' },
];
const ORDER = ['F0', '11', '1', '2', '3', '4', '5', '6', '7', '8', '9', '12', '13', '14', '10'];
const badge = (r) => `<i style="background:${PC[r.ph]}">${r.id}</i>`;
const run = (id) => RUNS.find(r => r.id === id);
const SZ = { S: 'kecil', M: 'sedang', L: 'besar' };
function runCard(id, body) {
  const r = run(id);
  return `<div class="run"><div class="rh">${badge(r)}<b>${r.id === 'F0' ? '' : 'Run ' + r.id + ' · '}${r.name}</b><span class="size${r.size === 'L' ? ' l' : ''}">${SZ[r.size]}</span></div>
    ${body.files ? `<div class="files">${body.files.map(f => `<span>${f}</span>`).join('')}</div>` : ''}
    <ul>${body.tasks.map(t => `<li>${t}</li>`).join('')}</ul>
    <div class="done"><b>Selesai kalau:</b> ${body.done}</div>
    ${body.args ? `<div class="args"><span>build ›</span> ${body.args}</div>` : ''}</div>`;
}
const thumbs = (items) => `<div class="thumbs">${items.map(([src, cap]) => `<div><img src="img/${src}.png" alt="${cap}"><div class="cap">${cap}</div></div>`).join('')}</div>`;

const PHASES = [['Fase 0', 'Persiapan', 'Pull, preflight'], ['Fase 1', 'Tampilan', 'Judul, lirik'], ['Fase 2', 'CLI', 'Ikut folder'], ['Fase 3', 'Sistem', 'Monitor, deep clean'], ['Fase 4', 'Clipboard', 'Riwayat, screenshot'], ['Fase 5', 'Penutup', 'Halaman, 3.1.0'], ['Fase 6', 'Tambahan', 'Fix musik, Vale, kucing, login']];
const cover = `<section class="page dark"><div class="cv">
  <div class="eyebrow">Dynamic Island for Windows · rencana kerja</div>
  <div style="display:flex;align-items:center;gap:36px">${robot(120)}
    <div><div class="big">Rencana v3.1</div>
      <div class="sub">Lirik yang tidak terpotong, CLI yang ikut folder, judul tegak, halaman Sistem dengan deep clean dua mode, clipboard sendiri, preview screenshot, perbaikan musik ter-pause, nama baru Vale dengan maskot kucing, dan login Google satu klik. Dijalankan per run dengan workflow <b style="color:var(--tx)">build</b>.</div></div></div>
  <div class="phases" style="grid-template-columns:repeat(7,1fr)">${PHASES.map(([k, b, d], i) => `<div style="border-color:${PC[i]}"><span style="color:${PC[i]}">${k}</span><b>${b}</b>${d}</div>`).join('')}</div></div>
  ${folio('27 Oktober 2026').replace('class="folio"', 'class="folio" style="color:var(--tx)"')}</section>`;

const OV = [
  ['r31-lirik', 'Lirik', 'Notch melebar 220–560 px, bergeser kalau lebih panjang.'],
  ['r31-cli', 'CLI ikut folder', 'Folder Explorer terakhir, plus menu favorit & riwayat.'],
  ['r31-judul', 'Judul tegak', 'DM Sans 600 menggantikan Fraunces Italic.'],
  ['r31-sistem', 'Sistem', 'CPU, RAM, disk, proses teratas, peringatan di notch.'],
  ['r31-clean', 'Deep clean · opsi D', 'Pilih sendiri (bawaan) atau Otomatis dengan Mole.'],
  ['r31-clipboard', 'Clipboard', 'Riwayat 50 item di panel, privasi aman.'],
];
const overview = `<section class="page"><div class="eyebrow">Ringkasan</div><h1>Apa yang dikerjakan</h1>
  <div class="ov">${OV.map(([img, t, d]) => `<div class="oc"><div class="im" style="background-image:url('img/${img}.png')"></div><div class="tx"><b>${t}</b><p>${d}</p></div></div>`).join('')}</div>
  <p style="font-size:11px;color:var(--ink2);margin-top:10px">Ditambah: preview screenshot (Run 8), 9 halaman panel (Run 9), fix musik ter-pause (Run 11), nama Vale (Run 12), maskot kucing (Run 13), login Google satu klik (Run 14).</p>
  ${folio('Ringkasan')}</section>`;

const roadmap = `<section class="page"><div class="eyebrow">Peta jalan</div><h1>Lima belas langkah, dalam urutan ini</h1>
  <div class="road">${ORDER.map(run).map(r => `<div class="rrow"><span class="ph" style="color:${PC[r.ph]}">Fase ${r.ph}</span>
    <div class="nm">${badge(r)}<div><b>${r.id === 'F0' ? r.name : 'Run ' + r.id + ' · ' + r.name}</b><small>${r.sub}</small></div></div>
    <span class="size${r.size === 'L' ? ' l' : ''}">${SZ[r.size]}</span><span class="dep">${r.dep}</span></div>`).join('')}</div>
  <p style="font-size:11px;color:var(--ink2);margin-top:10px">Satu run = satu kali workflow <strong>build</strong> (Plan → Build → Review → Check → Ship ke <code>main</code>). Rencana lengkap untuk agen: <code>docs/superpowers/plans/2026-10-27-v3.1.md</code>.</p>
  ${folio('Peta jalan')}</section>`;

const f01 = `<section class="page"><div class="eyebrow">Fase 0 & 1 · persiapan dan tampilan</div>
  <div class="split" style="margin-top:10px"><div class="runs c3">
    ${runCard('F0', { tasks: ['<code>git pull</code>.', 'PC baru: jalankan ulang preflight AGENTS.md (abaikan <code>.claude/preflight.done</code>).', 'Rust stable (MSVC) + VS 2022 Build Tools (C++).', '<code>cargo test --locked</code> hijau.'], done: 'build & test jalan di PC itu.' })}
    ${runCard('1', { files: ['fonts.rs', 'render.rs', 'render_panel.rs', 'panel_layout.rs', 'settings_*.rs', 'editor_layout.rs', 'app.rc', 'make-fonts.ps1'],
      tasks: ['Semua Fraunces Italic → DM Sans 600, rapat −2,5%.', 'Termasuk jam di notch, jam Pomodoro, judul lagu, lirik.', 'Hapus RCDATA 201/202, file & skrip Fraunces, kredit README.'],
      done: 'tidak ada "Fraunces" di <code>src/</code>; exe lebih kecil.', args: 'Ganti semua Fraunces Italic dengan DM Sans 600 sesuai Run 1 di rencana v3.1.' })}
    ${runCard('2', { files: ['geometry.rs', 'render.rs'],
      tasks: ['Lebar <code>MediaLyric</code> = teks + robot + padding, 220 – min(560, 45% layar).', 'Animasi 180 ms; tidak menyusut < 40 px.', 'Lebih panjang: diam 1 dtk lalu bergeser, ujung memudar.'],
      done: 'test geometri; tidak ada "…" untuk baris ≤ 560 px.', args: 'Buat notch lirik melebar mengikuti panjang baris sesuai Run 2 di rencana v3.1.' })}
  </div>${thumbs([['r31-judul', 'Judul tegak'], ['r31-lirik', 'Lirik melebar']])}</div>
  ${folio('Fase 0–1')}</section>`;

const f23 = `<section class="page"><div class="eyebrow">Fase 2 & 3 · CLI dan monitor</div>
  <div class="split" style="margin-top:10px"><div class="runs c2">
    ${runCard('3', { files: ['cli.rs', 'render_panel.rs', 'panel_layout.rs', 'app.rs', 'settings_layout.rs'],
      tasks: ['Saat halaman CLI dibuka & tidak ada perintah: folder Explorer terakhir via <code>IShellWindows</code>.', 'Chip "dari Explorer" + baris info di output.', 'Menu folder: Explorer terbuka, Favorit, Terakhir dipakai (5).', 'Pengaturan: Folder awal CLI = Ikuti Explorer / Folder terakhir.', 'Tidak mengambil foreground (lihat catatan fokus CLI).'],
      done: 'test favorit/riwayat; tidak pindah folder di tengah perintah.', args: 'CLI pindah ke folder Explorer terakhir dan dapat menu folder sesuai Run 3 di rencana v3.1.' })}
    ${runCard('4', { files: ['src/system.rs (baru)', 'model.rs', 'render_panel.rs', 'panel_layout.rs', 'settings_layout.rs'],
      tasks: ['CPU <code>GetSystemTimes</code>, RAM <code>GlobalMemoryStatusEx</code>, disk <code>GetDiskFreeSpaceExW</code>, 3 proses teratas.', 'Halaman Sistem: cincin CPU + grafik 60 dtk, bar RAM & disk, uptime, tombol Bersihkan.', 'Update 2 dtk saat terlihat; cek latar 5 mnt untuk peringatan (robot lesu).', 'Pengaturan: batas disk 10 GB, RAM 90%.'],
      done: 'tanpa redraw saat tertutup; test peringatan sekali-lewat.', args: 'Tambah halaman panel Sistem untuk CPU, RAM, disk dan proses teratas sesuai Run 4 di rencana v3.1.' })}
  </div>${thumbs([['r31-cli', 'CLI ikut folder'], ['r31-sistem', 'Halaman Sistem']])}</div>
  ${folio('Fase 2–3')}</section>`;

const f3b = `<section class="page"><div class="eyebrow">Fase 3 · deep clean (opsi D)</div>
  <div class="split" style="margin-top:10px"><div class="runs c2">
    ${runCard('5', { files: ['src/clean.rs (baru)', 'render_panel.rs', 'panel_layout.rs', 'README / NOTICE'],
      tasks: ['7 kategori; lokasi mengacu Mole Windows (MIT, data saja, dengan kredit).', 'Pindai di latar → ukuran per kategori; centang awal 3 teratas.', 'Cache dihapus permanen; file pengguna ke Recycle Bin; file terkunci dilewati.', 'Kategori admin lewat proses terpisah (<code>runas</code>).', 'Hasil = selisih sisa disk yang diukur island.'],
      done: 'test lokasi & umur file; tidak ada hapus tanpa konfirmasi.', args: 'Bangun pembersih island (mode Pilih sendiri) sesuai Run 5 di rencana v3.1 dan deepclean-opsi-d.pdf.' })}
    ${runCard('6', { files: ['src/clean.rs', 'render_panel.rs', 'settings_layout.rs'],
      tasks: ['Deteksi Mole (<code>mole.ps1</code> / <code>mo</code>, VERSION); belum ada → "Cara memasang".', 'Selalu pratinjau <code>--dry-run</code> → 4 grup → "Yakin? Hapus permanen" → jalan.', 'Log di panel tanpa ANSI; hasil diukur island; format rusak → "lihat log".', 'Whitelist awal: cache Cargo & Autodesk; "+ Sistem (admin)" tidak dicentang.', 'Chip Eksperimental; versi ≠ 1.30.x → peringatan.'],
      done: 'test parser pada output nyata & rusak; tak pernah jalan tanpa pratinjau.', args: 'Tambah mode Otomatis dengan Mole di halaman Bersihkan sesuai Run 6 di rencana v3.1.' })}
  </div>${thumbs([['r31-clean', 'Dua mode'], ['r31-mole', 'Alur mode Mole']])}</div>
  ${folio('Fase 3')}</section>`;

const f4 = `<section class="page"><div class="eyebrow">Fase 4 · clipboard dan screenshot</div>
  <div class="split" style="margin-top:10px"><div class="runs c2">
    ${runCard('7', { files: ['src/clipboard.rs (baru)', 'shortcuts.rs', 'render_panel.rs', 'panel_layout.rs', 'settings_layout.rs'],
