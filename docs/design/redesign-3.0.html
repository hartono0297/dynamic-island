<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Redesign Dynamic Island</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400;1,9..144,500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #EEEDE9;
    --ink: #161616;
    --ink2: #5E5E5A;
    --rule: #D6D4CE;
  }
  @page { size: 297mm 210mm; margin: 0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #9a9a96; }
  body { font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; color: var(--ink);
         -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .page { width: 297mm; height: 210mm; overflow: hidden; position: relative; margin: 0 auto 16px;
          padding: 34px 44px; background: var(--paper); break-after: page; }
  @media print { html, body { background: none; } .page { margin: 0; } }
  .page.dark { background: var(--s); color: var(--tx); }
  .folio { position: absolute; left: 44px; right: 44px; bottom: 18px; display: flex; justify-content: space-between;
           font-size: 10px; letter-spacing: .08em; text-transform: uppercase; opacity: .55; }
  .eyebrow { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; font-weight: 600; opacity: .6; }
  h1 { font-size: 30px; font-weight: 600; letter-spacing: -.01em; }
  h2 { font-size: 15px; font-weight: 600; margin-bottom: 10px; }
  p, li { font-size: 12.5px; line-height: 1.5; }
  .muted { color: var(--ink2); }

  /* ---------- cover ---------- */
  .cover { background: #0A0A0B; color: #F2F2F2; display: flex; flex-direction: column; justify-content: space-between; }
  .cover h1 { font-size: 54px; line-height: 1.02; letter-spacing: -.02em; font-weight: 600; }
  .cover .sub { font-size: 16px; opacity: .7; margin-top: 14px; max-width: 560px; line-height: 1.5; }
  .cover-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
  .cover-card { border-radius: 18px; padding: 22px; height: 210px; display: flex; flex-direction: column; justify-content: space-between; }
  .cover-card .n { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; opacity: .6; }
  .cover-card .nm { font-size: 26px; }

  /* ---------- notch ---------- */
  .desk { position: relative; height: 112px; border-radius: 12px; overflow: hidden; }
  .notch { position: absolute; left: 50%; transform: translateX(-50%); background: var(--s);
           display: flex; align-items: center; justify-content: center; color: var(--tx); box-shadow: 0 6px 18px rgba(0,0,0,.35); }
  .notch.idle { top: 10px; width: 150px; height: 32px; border-radius: var(--pillr); font-family: var(--fc); font-style: var(--fci); font-size: 14px; font-weight: 500; gap: 8px; }
  .notch.live { top: 52px; width: 330px; height: 50px; border-radius: calc(var(--pillr) * 1.2); justify-content: flex-start; padding: 0 9px; gap: 10px; }
  .art { width: 34px; height: 34px; border-radius: var(--tiler); background: var(--art); flex: none; }
  .live .tt { font-family: var(--fb); font-size: 12px; font-weight: 600; line-height: 1.2; }
  .live .st { font-family: var(--fb); font-size: 10.5px; color: var(--tx2); }
  .eq { margin-left: auto; display: flex; gap: 2.5px; align-items: flex-end; height: 16px; margin-right: 6px; }
  .eq i { width: 3px; background: var(--a); border-radius: var(--eqr); display: block; }
  .dotlive { width: 7px; height: 7px; border-radius: var(--dotr); background: var(--a); }

  /* ---------- panel ---------- */
  .panel { background: var(--s); color: var(--tx); border-radius: 0 0 var(--panelr) var(--panelr); position: relative;
           font-family: var(--fb); box-shadow: 0 10px 28px rgba(0,0,0,.28); }
  .dots { position: absolute; bottom: 9px; left: 0; right: 0; display: flex; justify-content: center; gap: 6px; }
  .dots i { width: 5px; height: 5px; border-radius: var(--dotr); background: var(--dot); display: block; }
  .dots i.on { background: var(--a); width: var(--dotw); }
  .cal { width: 520px; height: 248px; display: grid; grid-template-columns: 250px 1fr; padding: 16px 18px 26px; gap: 14px; }
  .cal-h { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .cal-h b { white-space: nowrap; font-family: var(--fd); font-size: var(--fdsize); font-weight: var(--fdw); font-style: var(--fdi); letter-spacing: var(--fdls); }
  .seg { display: flex; background: var(--r); border-radius: var(--ctlr); padding: 2px; font-size: 10px; }
  .seg span { padding: 2px 6px; border-radius: var(--ctlr); color: var(--tx2); }
  .seg span.on { background: var(--rh); color: var(--tx); }
  .grid7 { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; row-gap: 3px; }
  .grid7 .wd { font-size: 9px; color: var(--tx2); padding-bottom: 3px; letter-spacing: .04em; }
  .grid7 .d { font-family: var(--fn); font-size: 11px; height: 25px; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
  .grid7 .d.out { color: var(--dot); }
  .grid7 .d.today span { background: var(--a); color: var(--ai); width: 24px; height: 22px; display: flex; align-items: center; justify-content: center; border-radius: var(--ctlr); font-weight: 600; }
  .grid7 .d em { position: absolute; bottom: 0; width: 3px; height: 3px; border-radius: var(--dotr); background: var(--a2); }
  .evs { border-left: 1px solid var(--t); padding-left: 14px; }
  .evs .day { font-size: 10.5px; color: var(--tx2); margin-bottom: 8px; }
  .ev { display: flex; gap: 8px; margin-bottom: 8px; }
  .ev i { width: 3px; border-radius: 2px; flex: none; }
  .ev b { font-size: 11.5px; font-weight: 500; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 205px; }
  .ev small { font-size: 10px; color: var(--tx2); font-family: var(--fn); }
  .add { font-size: 11px; color: var(--a); margin-top: 4px; }

  .sc { width: 520px; height: 226px; padding: 16px 18px 26px; }
  .sc-h { font-family: var(--fd); font-size: var(--fdsize); font-weight: var(--fdw); font-style: var(--fdi); letter-spacing: var(--fdls); margin-bottom: 12px; }
  .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .tile { background: var(--r); border-radius: var(--tiler); height: 70px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-size: 10.5px; color: var(--tx); border: var(--tileb); }
  .tile svg { width: 22px; height: 22px; color: var(--tx); }

  /* ---------- settings window (light) ---------- */
  .win { width: 470px; height: 330px; background: var(--wbg); border-radius: 10px; overflow: hidden; box-shadow: 0 12px 30px rgba(0,0,0,.18);
         font-family: var(--fb); color: var(--wtx); display: grid; grid-template-columns: 140px 1fr; grid-template-rows: 26px 1fr; border: 1px solid rgba(0,0,0,.08); }
  .win .bar { grid-column: 1 / 3; font-size: 10px; display: flex; align-items: center; gap: 6px; padding: 0 10px; color: var(--wtx2); }
  .win .bar svg { width: 14px; height: 14px; }
  .side { padding: 6px 8px; }
  .side .brand { display: flex; align-items: center; gap: 7px; font-family: var(--fd); font-weight: var(--fdw); font-style: var(--fdi); font-size: 12px; margin: 4px 4px 12px; }
  .side .brand svg { width: 22px; height: 22px; }
  .nav { display: flex; align-items: center; gap: 8px; font-size: 11px; padding: 6px 8px; border-radius: var(--ctlr); margin-bottom: 2px; color: var(--wtx); }
  .nav svg { width: 14px; height: 14px; }
  .nav.on { background: var(--wsel); }
  .main { padding: 6px 16px 0 6px; }
  .main h3 { font-family: var(--fd); font-weight: var(--fdw); font-style: var(--fdi); font-size: 17px; margin: 4px 0 10px; letter-spacing: var(--fdls); }
  .card { background: var(--wcard); border-radius: calc(var(--tiler) * .8); border: 1px solid var(--wborder); }
  .row { display: flex; align-items: center; justify-content: space-between; padding: 8px 11px; border-top: 1px solid var(--wborder); }
  .row:first-child { border-top: 0; }
  .row b { font-size: 11px; font-weight: 500; display: block; }
  .row small { font-size: 9.5px; color: var(--wtx2); }
  .tog { width: 30px; height: 17px; border-radius: var(--togr); background: var(--wa); position: relative; }
  .tog::after { content: ""; position: absolute; right: 2px; top: 2px; width: 13px; height: 13px; border-radius: var(--togr); background: var(--wai); }
  .tog.off { background: transparent; border: 1.5px solid var(--wtx2); }
  .tog.off::after { left: 2px; right: auto; top: 1.5px; width: 11px; height: 11px; background: var(--wtx2); }
  .wseg { display: flex; border: 1px solid var(--wborder); border-radius: var(--ctlr); padding: 2px; font-size: 10px; background: var(--wbg); }
  .wseg span { padding: 2px 9px; border-radius: var(--ctlr); }
  .wseg span.on { background: var(--wa); color: var(--wai); }
  .step { display: flex; align-items: center; gap: 8px; font-size: 10.5px; font-family: var(--fn); }
  .step i { width: 20px; height: 20px; border: 1px solid var(--wborder); border-radius: var(--ctlr); display: flex; align-items: center; justify-content: center; font-style: normal; background: var(--wcard); }

  /* ---------- identity page ---------- */
  .id-head { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 22px; }
  .id-name { font-family: var(--fd); font-weight: var(--fdw); font-style: var(--fdi); font-size: 52px; line-height: 1; letter-spacing: var(--fdls); }
  .id-tag { font-family: var(--fb); font-size: 14px; color: var(--tx2); margin-top: 8px; max-width: 520px; line-height: 1.45; }
  .chips { display: flex; gap: 6px; }
  .chip { font-family: var(--fb); font-size: 11px; padding: 5px 11px; border: 1px solid var(--t); border-radius: var(--chipr); color: var(--tx2); }
  .id-grid { display: grid; grid-template-columns: 250px 1fr 300px; gap: 22px; }
  .box { background: var(--r); border-radius: var(--tiler); padding: 16px; }
  .box h4 { font-family: var(--fb); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--tx2); font-weight: 500; margin-bottom: 12px; }
  .logo-big svg { width: 150px; height: 150px; display: block; margin: 2px auto 12px; }
  .logo-sizes { display: flex; justify-content: center; align-items: flex-end; gap: 14px; margin-bottom: 12px; }
  .wordmark { text-align: center; font-family: var(--fd); font-weight: var(--fdw); font-style: var(--fdi); font-size: 19px; letter-spacing: var(--fdls); }
  .sw-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 14px; }
  .sw { font-family: var(--fn); font-size: 9.5px; color: var(--tx2); }
  .sw i { display: block; height: 46px; border-radius: calc(var(--tiler) * .6); margin-bottom: 5px; border: 1px solid rgba(255,255,255,.08); }
  .sw b { display: block; font-family: var(--fb); color: var(--tx); font-weight: 500; font-size: 10.5px; }
  .acc-row { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
  .acc-row .sw i { height: 34px; display: flex; align-items: center; justify-content: center; font-style: normal; font-size: 11px; font-weight: 600; }
  .type-num { font-family: var(--fc); font-style: var(--fci); font-size: 64px; line-height: 1; font-weight: var(--fnw); letter-spacing: -.02em; }
  .type-disp { font-family: var(--fd); font-weight: var(--fdw); font-style: var(--fdi); font-size: 26px; letter-spacing: var(--fdls); margin: 10px 0 4px; }
  .type-body { font-family: var(--fb); font-size: 13px; color: var(--tx); }
  .type-meta { font-family: var(--fb); font-size: 10.5px; color: var(--tx2); margin-top: 10px; line-height: 1.6; }
  .type-meta b { color: var(--tx); font-weight: 500; }
  .icons { display: grid; grid-template-columns: repeat(15, 1fr); gap: 6px; margin-top: 18px; }
  .ic { display: flex; flex-direction: column; align-items: center; gap: 6px; font-family: var(--fb); font-size: 9px; color: var(--tx2); }
  .ic span { width: 46px; height: 46px; background: var(--r); border-radius: var(--tiler); display: flex; align-items: center; justify-content: center; }
  .ic svg { width: 22px; height: 22px; color: var(--tx); }

  /* ---------- UI page ---------- */
  .ui-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 16px; }
  .ui-grid { display: grid; grid-template-columns: 520px 1fr; gap: 28px; }
  .stack > * + * { margin-top: 14px; }
  .notes { margin-top: 16px; }
  .notes li { list-style: none; padding-left: 14px; position: relative; margin-bottom: 5px; font-size: 12px; }
  .notes li::before { content: ""; position: absolute; left: 0; top: 7px; width: 6px; height: 6px; background: var(--a); border-radius: var(--dotr); }

  /* ---------- tables ---------- */
  table { width: 100%; border-collapse: collapse; font-size: 11.5px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--rule); vertical-align: top; line-height: 1.45; }
  th { font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink2); font-weight: 600; }
  td:first-child { font-weight: 600; width: 120px; }
  .pill { display: inline-block; font-size: 10px; padding: 2px 8px; border-radius: 99px; background: #DEDCD6; }
  .audit { display: grid; grid-template-columns: 1.15fr 1fr; gap: 28px; }
  .shots img { width: 100%; display: block; border-radius: 10px; margin-bottom: 10px; }
  .shots .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .tok { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0 14px; }
  .tok i { width: 34px; height: 34px; border-radius: 8px; display: block; border: 1px solid rgba(0,0,0,.08); }
  .issue { padding: 9px 0; border-bottom: 1px solid var(--rule); }
  .issue b { font-size: 12.5px; }
  .plan { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-top: 8px; }
  .step-card { background: #F8F7F4; border-radius: 12px; padding: 14px; border: 1px solid var(--rule); }
  .step-card .k { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink2); font-weight: 600; }
  .step-card h5 { font-size: 14px; margin: 4px 0 6px; }
  .step-card p { font-size: 11.5px; }
  .step-card code { font-family: "Cascadia Mono", Consolas, monospace; font-size: 10.5px; background: #E8E6E0; padding: 0 4px; border-radius: 4px; }
</style>
</head>

// ---------- icons (24 grid, own geometry) ----------
function icon(name, st) {
  const r = st.r;
  const closed = (d) => st.duo ? `<path d="${d}" fill="var(--a)" fill-opacity=".38" stroke="none"/>` : '';

    music: circFill(6.5, 18, 2.5) + p('M9 18V6l11-2v12') + circ(6.5, 18, 2.5) + circ(17.5, 16, 2.5) + p('M9 9.5l11-2'),
    terminal: rectFill(3, 5, 18, 14) + rect(3, 5, 18, 14) + p('M7 10l3 2.5L7 15M12.5 15H17'),
    grid: rectFill(4, 4, 7, 7, Math.min(r, 2)) + rect(4, 4, 7, 7, Math.min(r, 2)) + rect(13, 4, 7, 7, Math.min(r, 2)) + rect(4, 13, 7, 7, Math.min(r, 2)) + rect(13, 13, 7, 7, Math.min(r, 2)),
    palette: circFill(12, 12, 9) + p('M12 3a9 9 0 0 0 0 18c1.3 0 1.8-1 1.4-2-.5-1.2.3-2.4 1.6-2.4H17a4 4 0 0 0 4-4c0-5.2-4-9.6-9-9.6z') + dot(7.5, 11) + dot(10, 7.5) + dot(14.5, 7.5),
    link: p('M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1.2 1.2M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1.2-1.2'),
    info: circFill(12, 12, 9) + circ(12, 12, 9) + p('M12 11v6') + dot(12, 7.8),

// ---------- building blocks ----------
const svgOf = (name, d) => icon(name, d.icon);

function notches(d) {
  const clock = d.id === 'signal' ? '<span class="dotlive"></span>14:32' : '14:32';
  const heights = [6, 13, 9, 15, 7];
  return `<div class="desk" style="background:${d.deskBg}">
    <div class="notch idle">${clock}</div>
    <div class="notch live"><div class="art"></div>
      <div><div class="tt">Senja di Kemang</div><div class="st">Studio Ruang · 1:42 / 3:58</div></div>
      <div class="eq">${heights.map(h => `<i style="height:${h}px"></i>`).join('')}</div>
    </div></div>`;
}

function pageDots(active) {
  return `<div class="dots">${[0,1,2,3,4,5,6].map(i => `<i class="${i === active ? 'on' : ''}"></i>`).join('')}</div>`;
}

function calendar(d) {
  const wd = ['Sen','Sel','Rab','Kam','Jum','Sab','Min'];
  const cells = [];
  for (const n of [28, 29, 30]) cells.push({ n, out: true });
  for (let n = 1; n <= 31; n++) cells.push({ n });
  cells.push({ n: 1, out: true });
  const marks = new Set([25, 26, 27, 28]);
  const grid = wd.map(w => `<div class="wd">${w}</div>`).join('') + cells.map(c =>
    `<div class="d${c.out ? ' out' : ''}${!c.out && c.n === 26 ? ' today' : ''}"><span>${c.n}</span>${!c.out && marks.has(c.n) && c.n !== 26 ? '<em></em>' : ''}</div>`).join('');
  const evs = [
    [d.v.a2, 'Pameran arsitektur Jakarta', 'Sepanjang hari · 25–28 Okt'],
    [d.v.a, 'Review desain klien', '10:00 – 11:30'],
    [d.accents[4][1], 'Rapat koordinasi MEP', '14:00 – 15:00'],
  ];
  return `<div class="panel cal"><div>
      <div class="cal-h"><b>Oktober 2026</b><div class="seg"><span>Hari</span><span>Minggu</span><span class="on">Bulan</span></div></div>
      <div class="grid7">${grid}</div></div>
    <div class="evs" style="padding-top:30px"><div class="day">Senin, 26 Oktober</div>
      ${evs.map(([c, t, s]) => `<div class="ev"><i style="background:${c}"></i><div><b>${t}</b><small>${s}</small></div></div>`).join('')}
      <div class="add">+ Tambah event</div></div>
    ${pageDots(0)}</div>`;
}

function shortcuts(d) {
  const t = [['camera','Screenshot'],['clipboard','Clipboard'],['emoji','Emoji'],['folder','Explorer'],['calc','Kalkulator'],['activity','Task Manager'],['gear','Pengaturan'],['lock','Kunci layar']];
  return `<div class="panel sc"><div class="sc-h">Shortcuts</div>
    <div class="tiles">${t.map(([i, l]) => `<div class="tile">${svgOf(i, d)}<span>${l}</span></div>`).join('')}</div>
    ${pageDots(6)}</div>`;
}

  document.querySelectorAll('.page').forEach((p, i) => { if (i + 1 !== +only[1]) p.remove(); else p.style.margin = '0'; });
  document.body.style.background = 'none';
}
</script>
</body>
</html>
