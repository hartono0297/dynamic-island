<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio UI Lengkap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400;1,9..144,500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    /* island (always dark) */
    --s: #17120F; --r: #241D18; --rh: #3A2F27; --t: #332A23; --col: #1D1713;
    --tx: #F4EDE4; --tx2: #A89A8B; --dot: #4A3E35;
    --a: #E2683C; --ai: #17120F; --sage: #9DB59A; --ochre: #D9A441; --plum: #B07A9A;
    --term: #0F0C0A;
    /* document */
    --paper: #F1ECE4; --ink: #221A14; --ink2: #7A6B5D; --rule: #DDD3C6;
    --disp: 'Fraunces', serif; --body: 'DM Sans', sans-serif; --mono: 'DM Mono', monospace;
  }
  .wl { --wbg: #F4EEE6; --wcard: #FFFBF5; --wtx: #221A14; --wtx2: #7A6B5D; --wa: #C9542B; --wai: #FFFBF5;
        --wb: rgba(34,26,20,.10); --wsel: #EADFD1; --wfield: #FFFFFF; --wbtn: #EFE6DA; }
  .wd { --wbg: #1E1814; --wcard: #272019; --wtx: #F4EDE4; --wtx2: #A89A8B; --wa: #E2683C; --wai: #17120F;
        --wb: rgba(244,237,228,.08); --wsel: #33291F; --wfield: #2C241D; --wbtn: #33291F; }
  @page { size: 297mm 210mm; margin: 0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #9a948c; }
  body { font-family: var(--body); color: var(--ink); -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .page { width: 297mm; height: 210mm; overflow: hidden; position: relative; margin: 0 auto 16px; padding: 30px 40px; background: var(--paper); break-after: page; }
  .page.dark { background: var(--s); color: var(--tx); }
  @media print { html, body { background: none; } .page { margin: 0; } }
  .folio { position: absolute; left: 40px; right: 40px; bottom: 16px; display: flex; justify-content: space-between; font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase; opacity: .5; }
  .eyebrow { font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; font-weight: 600; color: var(--ink2); }
  .dark .eyebrow { color: var(--tx2); }
  h1 { font-family: var(--disp); font-style: italic; font-weight: 500; font-size: 30px; letter-spacing: -.01em; margin: 2px 0 16px; }
  .lbl { font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; font-weight: 600; color: var(--ink2); margin-bottom: 7px; }
  .ux h3 { font-family: var(--disp); font-style: italic; font-weight: 500; font-size: 19px; margin-bottom: 8px; }
  .ux li { list-style: none; position: relative; padding-left: 14px; font-size: 11.5px; line-height: 1.5; margin-bottom: 5px; color: #3E3229; }
  .ux li::before { content: ""; position: absolute; left: 0; top: 7px; width: 5px; height: 5px; border-radius: 50%; background: var(--a); }
  svg { display: block; }

  /* ---------- panel ---------- */
  .panel { width: 560px; height: 290px; background: var(--s); color: var(--tx); border-radius: 0 0 30px 30px; position: relative;
           padding: 18px 22px 30px; box-shadow: 0 14px 30px rgba(34,26,20,.22); overflow: hidden; }
  .ph { display: flex; align-items: center; justify-content: space-between; height: 28px; margin-bottom: 10px; }
  .ttl { font-family: var(--disp); font-style: italic; font-weight: 500; font-size: 20px; letter-spacing: -.01em; white-space: nowrap; }
  .hl { display: flex; align-items: center; gap: 10px; }
  .chev { display: flex; gap: 2px; color: var(--tx2); }
  .chev svg { width: 18px; height: 18px; }
  .seg { display: flex; background: var(--r); border-radius: 10px; padding: 2px; font-size: 10.5px; }
  .seg span { padding: 3px 9px; border-radius: 8px; color: var(--tx2); }
  .seg span.on { background: var(--rh); color: var(--tx); }
  .btn { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; padding: 5px 11px; border-radius: 99px; background: var(--r); color: var(--tx); }
  .btn svg { width: 13px; height: 13px; }
  .dots { position: absolute; bottom: 11px; left: 0; right: 0; display: flex; justify-content: center; gap: 6px; }
  .dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--dot); display: block; }
  .dots i.on { background: var(--a); }
  .mut { color: var(--tx2); }
  .num { font-variant-numeric: tabular-nums; }

  /* month */
  .month { display: grid; grid-template-columns: 252px 1fr; gap: 16px; height: 212px; }
  .g7 { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; row-gap: 2px; }
  .g7 .w { font-size: 9.5px; color: var(--tx2); padding-bottom: 4px; }
  .g7 .d { font-size: 11.5px; height: 30px; display: flex; align-items: center; justify-content: center; position: relative; font-variant-numeric: tabular-nums; }
  .g7 .d.o { color: var(--dot); }
  .g7 .d.t span { background: var(--a); color: var(--ai); width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 600; }
  .g7 .d em { position: absolute; bottom: 2px; width: 3.5px; height: 3.5px; border-radius: 50%; background: var(--sage); }
  .evs { border-left: 1px solid var(--t); padding-left: 16px; }
  .ev { display: flex; gap: 9px; margin-bottom: 10px; }
  .ev i { width: 3px; border-radius: 2px; flex: none; }
  .ev b { font-size: 12px; font-weight: 500; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 210px; }
  .ev small { font-size: 10.5px; color: var(--tx2); }
  .add { font-size: 11.5px; color: var(--a); display: flex; align-items: center; gap: 5px; }
  .add svg { width: 13px; height: 13px; }

  /* week */
  .week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; height: 212px; }
  .wcol { background: var(--col); border-radius: 12px; padding: 7px 5px; }
  .wcol .wh { text-align: center; font-size: 9.5px; color: var(--tx2); margin-bottom: 6px; }
  .wcol .wh b { display: block; font-size: 15px; color: var(--tx); font-weight: 500; margin-top: 1px; }
  .wcol.t .wh b { color: var(--a); }
  .chip { border-radius: 7px; padding: 4px 5px; font-size: 9px; line-height: 1.25; margin-bottom: 4px; background: var(--r); border-left: 2.5px solid var(--a); }
  .chip small { display: block; color: var(--tx2); font-size: 8.5px; }

  /* day */
  .allday { font-size: 10.5px; background: rgba(157,181,154,.16); color: var(--sage); border-radius: 8px; padding: 4px 9px; display: inline-block; margin-bottom: 6px; }
  .tl { position: relative; height: 180px; margin-left: 40px; }
  .tl .hr { position: absolute; left: -40px; right: 0; height: 0; border-top: 1px solid var(--t); }
  .tl .hr span { position: absolute; left: 0; top: -7px; font-size: 9.5px; color: var(--tx2); background: var(--s); padding-right: 6px; }
  .blk { position: absolute; left: 8px; right: 140px; border-radius: 9px; padding: 5px 9px; font-size: 11px; font-weight: 500; }
  .blk small { display: block; font-weight: 400; font-size: 9.5px; opacity: .8; }
  .now { position: absolute; left: -6px; right: 0; border-top: 1.5px solid var(--a); }
  .now::before { content: ""; position: absolute; left: -4px; top: -4.5px; width: 7px; height: 7px; border-radius: 50%; background: var(--a); }

  /* pomodoro */
  .pomo { display: grid; grid-template-columns: 220px 1fr; align-items: center; height: 236px; margin-top: -6px; }
  .ring { position: relative; width: 200px; height: 200px; }
  .ring .c { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .ring .tm { font-family: var(--disp); font-style: italic; font-size: 48px; font-weight: 400; letter-spacing: -.02em; line-height: 1; }
  .ring .ph2 { font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--a); margin-top: 8px; font-weight: 600; }
  .sess { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--tx2); margin-bottom: 18px; }
  .sess i { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--dot); display: block; }
  .sess i.f { background: var(--a); border-color: var(--a); }
  .ctl { display: flex; align-items: center; gap: 14px; }
  .cb { width: 44px; height: 44px; border-radius: 50%; background: var(--r); display: flex; align-items: center; justify-content: center; color: var(--tx); }
  .cb svg { width: 18px; height: 18px; }
  .cb.big { width: 62px; height: 62px; background: var(--a); color: var(--ai); }
  .cb.big svg { width: 24px; height: 24px; }
  .nextup { margin-top: 18px; font-size: 11.5px; color: var(--tx2); }
  .nextup b { color: var(--sage); font-weight: 500; }

  /* list rows (reminders) */
  .grp { font-size: 9.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--tx2); margin: 4px 0 3px; }
  .rrow { display: flex; align-items: center; gap: 10px; height: 29px; border-bottom: 1px solid var(--col); font-size: 12px; }
  .rrow svg { width: 17px; height: 17px; color: var(--tx2); flex: none; }
  .rrow .tm { width: 38px; color: var(--tx2); font-variant-numeric: tabular-nums; font-size: 11.5px; }
  .rrow .x { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tag { font-size: 9.5px; padding: 2px 7px; border-radius: 99px; background: rgba(217,164,65,.16); color: var(--ochre); }

  /* notes */
  .ngrid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
  .ncard { background: var(--r); border-radius: 16px; padding: 11px 13px; height: 92px; display: flex; flex-direction: column; }
  .ncard b { font-size: 12px; font-weight: 500; margin-bottom: 3px; }
  .ncard p { font-size: 10.5px; color: var(--tx2); line-height: 1.45; overflow: hidden; flex: 1; }
  .ncard small { font-size: 9.5px; color: var(--tx2); opacity: .75; margin-top: 4px; }

  /* music */
  .music { display: grid; grid-template-columns: 196px 1fr; gap: 24px; height: 230px; align-items: center; margin-top: -4px; }
  .cover { width: 196px; height: 196px; border-radius: 22px; background:
           radial-gradient(circle at 70% 30%, #F2C27A 0 18%, transparent 19%),
           linear-gradient(165deg, #E2683C 0%, #B4452A 55%, #5A2A1C 100%); position: relative; overflow: hidden; }
  .cover::after { content: ""; position: absolute; left: -10%; right: -10%; bottom: 22%; height: 2px; background: rgba(244,237,228,.45); }
  .src { font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--tx2); }
  .song { font-family: var(--disp); font-style: italic; font-size: 28px; font-weight: 500; letter-spacing: -.01em; margin: 6px 0 2px; }
  .bar { height: 4px; border-radius: 4px; background: var(--t); margin: 18px 0 6px; position: relative; }
  .bar i { position: absolute; left: 0; top: 0; bottom: 0; width: 43%; background: var(--tx); border-radius: 4px; }
  .bar i::after { content: ""; position: absolute; right: -5px; top: -3px; width: 10px; height: 10px; border-radius: 50%; background: var(--tx); }
  .times { display: flex; justify-content: space-between; font-size: 10px; color: var(--tx2); font-variant-numeric: tabular-nums; }
  .mctl { display: flex; align-items: center; gap: 16px; margin-top: 14px; }
  .mctl .ic { color: var(--tx); width: 20px; height: 20px; }
  .lyr { margin-left: auto; display: inline-flex; align-items: center; gap: 5px; font-size: 10.5px; padding: 5px 10px; border-radius: 99px; border: 1px solid var(--a); color: var(--a); }
  .lyr svg { width: 12px; height: 12px; }

  /* cli */
  .term { background: var(--term); border-radius: 16px; padding: 12px 14px; height: 200px; font-family: var(--mono); font-size: 11px; line-height: 1.6; color: #E6DED3; position: relative; }
  .term .p { color: var(--a); }
  .term .m { color: var(--tx2); }
  .term .in { position: absolute; left: 14px; right: 14px; bottom: 12px; border-top: 1px solid #241D18; padding-top: 8px; }
  .caret { display: inline-block; width: 7px; height: 13px; background: var(--a); vertical-align: -2px; }
  .shell { font-size: 10.5px; padding: 3px 9px; border-radius: 99px; background: var(--r); color: var(--tx2); font-family: var(--mono); }

  /* shortcuts */
  .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 9px; }
  .tile { background: var(--r); border-radius: 18px; height: 98px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 9px; font-size: 11px; }
  .tile svg { width: 24px; height: 24px; }

  /* ---------- notch states ---------- */
  .scr { height: 84px; border-radius: 14px; position: relative; overflow: hidden;
         background: linear-gradient(115deg, #6B4A36 0%, #A97B57 50%, #E0C4A0 100%); }
  .scr.alt { background: linear-gradient(115deg, #2F3B36 0%, #5E7A6C 55%, #B9C8B5 100%); }
  .nt { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); background: var(--s); color: var(--tx);
        border-radius: 999px; display: flex; align-items: center; gap: 9px; padding: 0 14px; height: 36px; white-space: nowrap;
        box-shadow: 0 8px 20px rgba(0,0,0,.3); font-size: 12px; }
  .nt.notchshape { top: 0; border-radius: 0 0 18px 18px; }
  .nt .clk { font-family: var(--disp); font-style: italic; font-size: 16px; }
  .nt .art { width: 22px; height: 22px; border-radius: 6px; background: linear-gradient(135deg, #E2683C, #D9A441); }
  .eq { display: flex; gap: 2px; align-items: flex-end; height: 13px; }
  .eq i { width: 2.5px; border-radius: 2px; background: var(--a); display: block; }
  .nt.big { height: 60px; border-radius: 26px; top: 12px; padding: 0 12px 0 12px; gap: 11px; }
  .badge { width: 40px; height: 40px; border-radius: 13px; display: flex; align-items: center; justify-content: center; flex: none; }
  .badge svg { width: 20px; height: 20px; }
  .nt .t1 { font-size: 12.5px; font-weight: 500; }
  .nt .t2 { font-size: 10.5px; color: var(--tx2); }
  .act { margin-left: 10px; font-size: 10.5px; padding: 5px 11px; border-radius: 99px; background: var(--a); color: var(--ai); font-weight: 500; }
  .act.ghost { background: var(--r); color: var(--tx); }
  .states { display: grid; grid-template-columns: 1fr 1fr; gap: 9px 22px; }
  .st .lbl { margin: 0 0 5px; }
  .st .d2 { font-size: 10.5px; color: var(--ink2); margin-top: 4px; }

  /* ---------- windows ---------- */
  .win { background: var(--wbg); color: var(--wtx); border-radius: 12px; overflow: hidden; border: 1px solid var(--wb);
         box-shadow: 0 14px 34px rgba(34,26,20,.18); display: flex; flex-direction: column; font-size: 11.5px; }
  .tb { height: 30px; display: flex; align-items: center; gap: 7px; padding: 0 0 0 11px; font-size: 10.5px; color: var(--wtx2); flex: none; }
  .tb .ctrls { margin-left: auto; display: flex; height: 100%; }
  .tb .ctrls span { width: 38px; display: flex; align-items: center; justify-content: center; }
  .tb .ctrls svg { width: 11px; height: 11px; }
  .wbody { flex: 1; display: grid; grid-template-columns: 150px 1fr; min-height: 0; }
  .side { padding: 4px 9px; }
  .brand { white-space: nowrap; display: flex; align-items: center; gap: 8px; font-family: var(--disp); font-style: italic; font-weight: 500; font-size: 12.5px; margin: 6px 2px 14px; }
  .nav { display: flex; align-items: center; gap: 9px; padding: 6px 9px; border-radius: 10px; margin-bottom: 2px; }
  .nav svg { width: 15px; height: 15px; }
  .nav.on { background: var(--wsel); }
  .main { padding: 2px 18px 14px 8px; }
  .main h2 { font-family: var(--disp); font-style: italic; font-weight: 500; font-size: 21px; margin: 4px 0 11px; }
  .sub { font-size: 9.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--wtx2); margin: 10px 0 6px; font-weight: 600; }
  .card { background: var(--wcard); border-radius: 14px; border: 1px solid var(--wb); }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 12px; border-top: 1px solid var(--wb); min-height: 42px; }
  .row:first-child { border-top: 0; }
  .row b { font-weight: 500; display: block; font-size: 11.5px; }
  .row small { font-size: 9.5px; color: var(--wtx2); }
  .tog { width: 32px; height: 18px; border-radius: 99px; background: var(--wa); position: relative; flex: none; }
  .tog::after { content: ""; position: absolute; right: 2px; top: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--wai); }
  .tog.off { background: transparent; border: 1.5px solid var(--wtx2); }
  .tog.off::after { left: 2px; right: auto; top: 1.5px; width: 12px; height: 12px; background: var(--wtx2); }
  .wseg { display: flex; border: 1px solid var(--wb); border-radius: 10px; padding: 2px; font-size: 10px; background: var(--wbg); flex: none; }
  .wseg span { padding: 3px 9px; border-radius: 8px; white-space: nowrap; }
  .wseg span.on { background: var(--wa); color: var(--wai); }
  .step { display: flex; align-items: center; gap: 8px; font-size: 11px; font-variant-numeric: tabular-nums; flex: none; }
  .step i { width: 22px; height: 22px; border: 1px solid var(--wb); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-style: normal; background: var(--wcard); }
  .step u { text-decoration: none; min-width: 48px; text-align: center; }
  .wbtn { font-size: 10.5px; padding: 5px 12px; border-radius: 99px; background: var(--wbtn); white-space: nowrap; flex: none; }
  .wbtn.pri { background: var(--wa); color: var(--wai); }
  .wbtn.dng { color: #C42B1C; }
  .wd .wbtn.dng { color: #FF8A73; }
  .field { background: var(--wfield); border: 1px solid var(--wb); border-radius: 10px; padding: 7px 10px; font-size: 11px; color: var(--wtx); }
  .field.ph { color: var(--wtx2); }
  .sw6 { display: flex; gap: 6px; flex: none; }
  .sw6 i { width: 18px; height: 18px; border-radius: 50%; display: block; }
  .sw6 i.on { box-shadow: 0 0 0 2px var(--wcard), 0 0 0 3.5px var(--wtx); }
  .status { white-space: nowrap; display: inline-flex; align-items: center; gap: 5px; font-size: 10.5px; color: #4E7A4A; }
  .wd .status { color: var(--sage); }
  .status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

  /* editors */
  .ed { width: 320px; }
  .ed .eb { padding: 6px 14px 14px; display: flex; flex-direction: column; gap: 9px; }
  .ed .fl { font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--wtx2); font-weight: 600; margin-bottom: -4px; }
  .ed .foot { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .ed .foot .sp { flex: 1; }

  /* tray menu */
  .menu { width: 210px; background: var(--wcard); border: 1px solid var(--wb); border-radius: 12px; padding: 5px; box-shadow: 0 12px 30px rgba(0,0,0,.3); color: var(--wtx); font-size: 11.5px; }
  .menu div { padding: 7px 10px; border-radius: 8px; display: flex; justify-content: space-between; }
  .menu div.on { background: var(--wsel); }
  .menu hr { border: 0; border-top: 1px solid var(--wb); margin: 4px 6px; }
  .menu small { color: var(--wtx2); }

  /* logo page */
  .lgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
  .lcard { background: #FBF7F1; border: 1px solid var(--rule); border-radius: 18px; padding: 16px; position: relative; }
  .lcard.rec { border: 2px solid var(--a); }
  .lcard .rtag { position: absolute; top: 12px; right: 12px; font-size: 9.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; background: var(--a); color: #FFFBF5; padding: 3px 8px; border-radius: 99px; }
  .lcard h4 { font-family: var(--disp); font-style: italic; font-weight: 500; font-size: 20px; margin: 12px 0 3px; }
  .lcard p { font-size: 11px; line-height: 1.45; color: var(--ink2); min-height: 48px; }
  .lmain { display: flex; justify-content: center; padding: 6px 0 2px; }
  .lsizes { display: flex; align-items: flex-end; justify-content: center; gap: 12px; margin-top: 12px; }
  .bars { margin-top: 12px; display: grid; gap: 6px; }
  .taskbar { height: 34px; border-radius: 8px; display: flex; align-items: center; gap: 10px; padding: 0 10px; }
  .taskbar.dk { background: #202020; }
  .taskbar.lt { background: #F3F3F3; border: 1px solid #E0E0E0; }
  .taskbar span { font-size: 10px; margin-left: auto; font-family: 'Segoe UI', sans-serif; }
  .taskbar.dk span { color: #ddd; }
  .taskbar .ghost { width: 16px; height: 16px; border-radius: 4px; background: #888; opacity: .35; }
  .lock { margin-top: 18px; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .lockup { border-radius: 18px; padding: 26px 30px; display: flex; align-items: center; gap: 18px; }
  .lockup .wm { font-family: var(--disp); font-style: italic; font-weight: 500; font-size: 34px; letter-spacing: -.01em; }

  /* tokens page */
  .tk { display: grid; grid-template-columns: 1.25fr 1fr; gap: 26px; }

  const S = {

  const cells = [[28,1],[29,1],[30,1]];

  const mk = new Set([2, 9, 14, 21, 25, 27, 28]);

}

  const rr = (size - sw) / 2 - 2, c = 2 * Math.PI * rr;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="transform:rotate(-90deg)">
    <circle cx="${size / 2}" cy="${size / 2}" r="${rr}" fill="none" stroke="var(--t)" stroke-width="${sw}"/>
    <circle cx="${size / 2}" cy="${size / 2}" r="${rr}" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${c * p} ${c}"/></svg>`;
}

    <div class="icrow">${['calendar','timer','bell','note','music','terminal','grid','gear','sparkle','trash'].map(n => `<span>${I(n)}</span>`).join('')}</div>
  </div></div>${folio('Token')}</section>`;

document.getElementById('doc').innerHTML = pages.join('') + tokens;

const only = /^#p(\d+)$/.exec(location.hash);
if (only) {
  document.querySelectorAll('.page').forEach((p, i) => { if (i + 1 !== +only[1]) p.remove(); else p.style.margin = '0'; });
  document.body.style.background = 'none';
}
</script>
