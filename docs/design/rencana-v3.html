<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rencana v3.0 Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400;1,9..144,500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F1ECE4; --ink: #221A14; --ink2: #7A6B5D; --rule: #DDD3C6; --card: #FBF7F1;
    --s: #17120F; --r: #241D18; --t: #332A23; --tx: #F4EDE4; --tx2: #A89A8B;
    --a: #E2683C; --sage: #9DB59A; --ochre: #D9A441; --plum: #B07A9A; --clay: #C9826B;
    --disp: 'Fraunces', serif; --body: 'DM Sans', sans-serif; --mono: 'DM Mono', monospace;
  }
  @page { size: 297mm 210mm; margin: 0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #9a948c; }
  body { font-family: var(--body); color: var(--ink); -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .page { width: 297mm; height: 210mm; overflow: hidden; position: relative; margin: 0 auto 16px; padding: 30px 40px; background: var(--paper); break-after: page; }
  .page.dark { background: var(--s); color: var(--tx); }
  @media print { html, body { background: none; } .page { margin: 0; } }
  svg { display: block; }
  .folio { position: absolute; left: 40px; right: 40px; bottom: 16px; display: flex; justify-content: space-between; font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase; opacity: .5; }
  .eyebrow { font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; font-weight: 600; color: var(--ink2); }
  .dark .eyebrow { color: var(--tx2); }
  h1 { font-family: var(--disp); font-style: italic; font-weight: 500; font-size: 30px; letter-spacing: -.01em; margin: 2px 0 14px; }
  .lbl { font-size: 10px; letter-spacing: .1em; text-transform: uppercase; font-weight: 600; color: var(--ink2); margin-bottom: 6px; }
  code, .mono { font-family: var(--mono); font-size: 10px; }
  code { background: #E8E0D4; padding: 0 4px; border-radius: 4px; }

  /* cover */
  .cv { display: flex; flex-direction: column; justify-content: space-between; height: calc(100% - 26px); }
  .cv .big { font-family: var(--disp); font-style: italic; font-weight: 500; font-size: 60px; line-height: 1.02; letter-spacing: -.02em; }
  .cv .sub { color: var(--tx2); font-size: 15px; line-height: 1.5; max-width: 560px; margin-top: 14px; }
  .phases { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; }
  .phases div { border-top: 2px solid var(--t); padding-top: 10px; font-size: 11px; color: var(--tx2); line-height: 1.4; }
  .phases b { display: block; color: var(--tx); font-family: var(--disp); font-style: italic; font-weight: 500; font-size: 16px; margin-bottom: 2px; }
  .phases span { display: inline-block; font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--a); font-weight: 600; margin-bottom: 4px; }

  /* overview cards */
  .ov { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .oc { background: var(--card); border: 1px solid var(--rule); border-radius: 16px; overflow: hidden; }
  .oc .im { height: 150px; background-size: cover; background-position: center top; border-bottom: 1px solid var(--rule); }
  .oc .tx { padding: 10px 13px 12px; }
  .oc b { font-family: var(--disp); font-style: italic; font-weight: 500; font-size: 17px; display: block; }
  .oc p { font-size: 10.5px; color: var(--ink2); line-height: 1.45; margin-top: 3px; }
  .oc .fr { font-size: 10px; margin-top: 6px; color: #3E3229; }
  .oc .fr s { color: var(--ink2); }

  /* roadmap */
  .road { position: relative; margin-top: 6px; }
  .rrow { display: grid; grid-template-columns: 120px 1fr 92px 230px; gap: 14px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--rule); }
  .rrow .ph { font-size: 10px; letter-spacing: .1em; text-transform: uppercase; font-weight: 600; color: var(--ink2); }
  .rrow .nm { display: flex; align-items: center; gap: 10px; }
  .rrow .nm i { width: 30px; height: 30px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-style: normal; font-weight: 600; font-size: 11px; color: #17120F; flex: none; }
  .rrow .nm b { font-size: 12.5px; font-weight: 500; }
  .rrow .nm small { display: block; font-size: 10.5px; color: var(--ink2); }
  .size { font-size: 10px; padding: 3px 9px; border-radius: 99px; background: #E6DCCF; justify-self: start; }
  .size.l { background: rgba(226,104,60,.18); color: #A8431F; }
  .dep { font-size: 10.5px; color: var(--ink2); }

  /* run cards */
  .runs { display: grid; gap: 14px; }
  .runs.c2 { grid-template-columns: 1fr 1fr; }
  .runs.c3 { grid-template-columns: 1fr 1fr 1fr; }
  .run { background: var(--card); border: 1px solid var(--rule); border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; }
  .run .rh { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .run .rh i { width: 32px; height: 32px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-style: normal; font-weight: 600; font-size: 11.5px; color: #17120F; flex: none; }
  .run .rh b { font-family: var(--disp); font-style: italic; font-weight: 500; font-size: 18px; line-height: 1.1; }
  .run .rh .size { margin-left: auto; }
  .run ul { margin: 2px 0 8px; }
  .run li { list-style: none; position: relative; padding-left: 13px; font-size: 10.8px; line-height: 1.45; margin-bottom: 3px; color: #3E3229; }
  .run li::before { content: ""; position: absolute; left: 0; top: 6px; width: 5px; height: 5px; border-radius: 50%; background: var(--a); }
  .files { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
  .files span { font-family: var(--mono); font-size: 9.5px; background: #EDE5DA; border-radius: 6px; padding: 2px 6px; color: #4A3D33; }
  .done { font-size: 10.5px; background: rgba(157,181,154,.18); border-radius: 10px; padding: 7px 10px; color: #3F5A3C; line-height: 1.45; margin-top: auto; }
  .done b { font-weight: 600; }
  .args { background: var(--s); color: var(--tx); border-radius: 10px; padding: 8px 10px; font-family: var(--mono); font-size: 9.5px; line-height: 1.5; margin-top: 8px; }
  .args span { color: var(--a); }
  .thumbs { display: grid; gap: 10px; }
  .thumbs img { width: 100%; display: block; border-radius: 10px; border: 1px solid var(--rule); }
  .thumbs .cap { font-size: 9.5px; color: var(--ink2); margin-top: 3px; }
  .split { display: grid; grid-template-columns: 1fr 300px; gap: 18px; }

  /* tables */
  table { width: 100%; border-collapse: collapse; font-size: 11px; }
  th, td { text-align: left; padding: 7px 9px; border-bottom: 1px solid var(--rule); vertical-align: top; line-height: 1.45; }
  th { font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink2); font-weight: 600; }
  .steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .stp { background: var(--card); border: 1px solid var(--rule); border-radius: 14px; padding: 12px 14px; }
  .stp .k { font-size: 9.5px; letter-spacing: .12em; text-transform: uppercase; font-weight: 600; color: var(--a); }
  .stp b { display: block; font-size: 13px; margin: 3px 0 4px; }
  .stp p { font-size: 10.5px; line-height: 1.45; color: #4A3D33; }
</style>
</head>
<body>
<div id="doc"></div>
<script>
const SQ = 'M82 12H174C227.2 12 244 28.8 244 82V174C244 227.2 227.2 244 174 244H82C28.8 244 12 227.2 12 174V82C12 28.8 28.8 12 82 12Z';
const logo = (s) => `<svg width="${s}" height="${s}" viewBox="0 0 256 256"><path d="${SQ}" fill="#E2683C"/><rect x="58" y="104" width="140" height="48" rx="24" fill="#17120F"/><circle cx="174" cy="128" r="9.5" fill="#F4EDE4"/></svg>`;
const robot = (s) => `<svg width="${s}" height="${s}" viewBox="0 0 64 64"><rect x="6" y="9" width="52" height="46" rx="18" fill="#E2683C"/><rect x="12" y="21" width="40" height="22" rx="11" fill="#17120F"/><path d="M20.5 34q4-6 8 0M35.5 34q4-6 8 0" fill="none" stroke="#F4EDE4" stroke-width="2.6" stroke-linecap="round"/></svg>`;

// phase colours
const PC = { 0: '#C9BBA8', 1: '#E2683C', 2: '#D9A441', 3: '#9DB59A', 4: '#C9826B', 5: '#B07A9A', 6: '#A3A55A' };
const folio = (r) => `<div class="folio"><span>Dynamic Island · Rencana v3.0 Studio</span><span>${r}</span></div>`;

const RUNS = [
  { id: 'F0', ph: 0, name: 'Persiapan', sub: 'Pasang Rust, commit desain, baseline test', size: 'S', dep: 'Manual, bukan workflow' },
  { id: '1', ph: 1, name: 'Warna Studio + logo Bata', sub: 'theme.rs, ikon app & tray', size: 'S', dep: 'Setelah F0' },
  { id: '2', ph: 1, name: 'Font tertanam', sub: 'Fraunces, DM Sans, DM Mono', size: 'M', dep: 'Setelah Run 1 (boleh tukar dengan Run 3)' },
  { id: '3', ph: 1, name: 'Set ikon sendiri', sub: 'Ganti Segoe Fluent', size: 'M', dep: 'Setelah Run 1' },
  { id: '4', ph: 2, name: 'Restyle notch, panel, pengaturan', sub: '6 halaman panel + Settings', size: 'L', dep: 'Setelah Run 1–3' },
  { id: '5', ph: 3, name: 'Kerangka editor + editor acara', sub: 'Tanpa kontrol tanggal Windows', size: 'L', dep: 'Setelah Run 4' },
  { id: '6', ph: 3, name: 'Editor pengingat', sub: 'Pakai kerangka Run 5', size: 'M', dep: 'Setelah Run 5' },
  { id: '6b', ph: 3, name: 'Mingguan pilih hari + pintasan', sub: 'Fitur baru, data pengingat', size: 'M', dep: 'Opsional, setelah Run 6' },
  { id: '7', ph: 4, name: 'CLI di dalam panel', sub: 'Fokus keyboard, hapus jendela CLI', size: 'L', dep: 'Setelah Run 4' },
  { id: '8', ph: 5, name: 'Robot Bata di notch', sub: 'Ekspresi, animasi, pengaturan', size: 'L', dep: 'Setelah Run 7' },
  { id: '9', ph: 6, name: 'Teks, screenshot, versi 3.0.0', sub: 'i18n, README, memori', size: 'S', dep: 'Terakhir' },
];
const badge = (r, big) => `<i style="background:${PC[r.ph]}">${r.id === 'F0' ? 'F0' : r.id}</i>`;
const run = (id) => RUNS.find(r => r.id === id);

function runCard(id, body) {
  const r = run(id);
  return `<div class="run"><div class="rh">${badge(r)}<b>${r.id === 'F0' ? '' : 'Run ' + r.id + ' · '}${r.name}</b><span class="size${r.size === 'L' ? ' l' : ''}">${{ S: 'kecil', M: 'sedang', L: 'besar' }[r.size]}</span></div>
    ${body.files ? `<div class="files">${body.files.map(f => `<span>${f}</span>`).join('')}</div>` : ''}
    <ul>${body.tasks.map(t => `<li>${t}</li>`).join('')}</ul>
    <div class="done"><b>Selesai kalau:</b> ${body.done}</div>
    ${body.args ? `<div class="args"><span>build ›</span> ${body.args}</div>` : ''}</div>`;
}
const thumbs = (items) => `<div class="thumbs">${items.map(([src, cap]) => `<div><img src="img/${src}.png" alt="${cap}"><div class="cap">${cap}</div></div>`).join('')}</div>`;

// ---------- pages ----------
const cover = `<section class="page dark"><div class="cv">
  <div class="eyebrow">Dynamic Island for Windows · rencana kerja</div>
  <div style="display:flex;align-items:center;gap:36px">
    <div style="display:flex;gap:16px;align-items:flex-end">${logo(130)}${robot(96)}</div>
    <div><div class="big">Rencana v3.0<br>Studio</div>
      <div class="sub">Semua yang disepakati jadi satu: warna, font, ikon dan logo baru, robot Bata di notch, editor acara & pengingat yang dibangun ulang, dan CLI di dalam panel. Dijalankan per run dengan workflow <b style="color:var(--tx)">build</b>.</div></div></div>
  <div class="phases">
    ${[['Fase 0', 'Persiapan', 'Rust, baseline'], ['Fase 1', 'Fondasi', 'Warna, logo, font, ikon'], ['Fase 2', 'Tampilan', 'Notch, panel, pengaturan'], ['Fase 3', 'Editor', 'Acara & pengingat'], ['Fase 4', 'CLI', 'Di dalam panel'], ['Fase 5', 'Robot', 'Bata di notch'], ['Fase 6', 'Penutup', 'Teks, screenshot, 3.0.0']].map(([k, b, d], i) => `<div style="border-color:${PC[i]}"><span style="color:${PC[i]}">${k}</span><b>${b}</b>${d}</div>`).join('')}</div></div>
  ${folio('26 Oktober 2026').replace('class="folio"', 'class="folio" style="color:var(--tx)"')}</section>`;

const OV = [
  ['ref-token', 'Warna & font', 'Espresso, krem, terakota. Fraunces Italic, DM Sans, DM Mono.', 'Hitam iOS + Segoe UI', 'Studio'],
  ['ref-logo', 'Logo Bata', 'Tile terakota dengan island espresso dan titik krem.', 'Tile gelap, titik biru', 'Bata'],
  ['ref-robot', 'Robot Bata', 'Logo yang punya mata; 10 ekspresi; hanya di notch.', 'Tidak ada', 'Asisten di notch'],
  ['ref-kalender', 'Panel & notch', 'Tujuh halaman, semua status notch, ikon sendiri.', 'Segoe Fluent, iOS', 'Gaya Studio'],
  ['ref-editor-acara', 'Editor acara & pengingat', 'Chip + popover kalender dan jam, tanpa kontrol Windows.', 'Kalender Win32, teks pelangi', 'Digambar sendiri'],
  ['ref-cli', 'CLI', 'Terminal langsung di halaman panel, status di notch.', 'Jendela popup', 'Di dalam panel'],
];
const overview = `<section class="page"><div class="eyebrow">Ringkasan</div><h1>Apa yang berubah</h1>
  <div class="ov">${OV.map(([img, t, d, from, to]) => `<div class="oc"><div class="im" style="background-image:url('img/${img}.png')"></div>
    <div class="tx"><b>${t}</b><p>${d}</p><div class="fr"><s>${from}</s> → <b style="font-family:var(--body);font-style:normal;font-size:10px;display:inline">${to}</b></div></div></div>`).join('')}</div>
  ${folio('Ringkasan')}</section>`;

const roadmap = `<section class="page"><div class="eyebrow">Peta jalan</div><h1>Sebelas langkah, berurutan</h1>
  <div class="road">${RUNS.map(r => `<div class="rrow"><span class="ph" style="color:${PC[r.ph]}">Fase ${r.ph}</span>
    <div class="nm">${badge(r)}<div><b>${r.id === 'F0' ? r.name : 'Run ' + r.id + ' · ' + r.name}</b><small>${r.sub}</small></div></div>
    <span class="size${r.size === 'L' ? ' l' : ''}">${{ S: 'kecil', M: 'sedang', L: 'besar' }[r.size]}</span><span class="dep">${r.dep}</span></div>`).join('')}</div>
  <p style="font-size:11px;color:var(--ink2);margin-top:12px">Satu run = satu kali workflow <b>build</b> (Plan → Build → Review → Check → Ship ke <code>main</code>). Run berikutnya dimulai setelah run sebelumnya hijau dan ter-push. Ukuran: kecil ≈ 1 task, besar = beberapa task paralel.</p>
  ${folio('Peta jalan')}</section>`;

const f01 = `<section class="page"><div class="eyebrow">Fase 0 & 1 · persiapan dan fondasi</div>
  <div class="split" style="margin-top:10px"><div class="runs c2">
    ${runCard('F0', { tasks: ['Pasang Rust: <code>winget install Rustlang.Rustup</code>, toolchain stable, VS Build Tools (C++).', '<code>cargo test --locked</code> hijau di <code>main</code>.', 'Commit <code>docs/design/</code> dan rencana ini.'], done: '<code>cargo</code> jalan dan semua test hijau.' })}
    ${runCard('1', { files: ['src/theme.rs', 'assets/logo.svg', 'scripts/make-icon.ps1', 'assets/icon.ico', 'src/ui/app_icon.rs'],
      tasks: ['Aksen: Terracotta, Sage, Ochre, Clay, Olive, Plum. Island: Espresso / Graphite.', 'Palet jendela terang & gelap Studio.', 'Alias nama lama (Blue→Terracotta, dst.) agar config lama aman.', 'Logo Bata + regenerasi ikon.'],
      done: 'test kontras lulus; ikon tray 16 px terbaca.', args: 'Ganti palet ke Studio dan logo ke Bata sesuai rencana v3-studio Run 1.' })}
    ${runCard('2', { files: ['assets/fonts/', 'render.rs', 'render_panel.rs', 'settings_controls.rs'],
      tasks: ['Subset Latin + OFL.txt.', 'DirectWrite in-memory font collection; GDI via AddFontMemResourceEx.', 'Fallback ke Segoe UI kalau gagal.'],
      done: 'exe naik ≤ 400 KB; screenshot demo memakai font baru.', args: 'Tanam font Fraunces, DM Sans dan DM Mono sesuai rencana v3-studio Run 2.' })}
    ${runCard('3', { files: ['src/ui/icons.rs (baru)', 'shortcuts.rs', 'render.rs', 'settings_controls.rs'],
      tasks: ['Path 24-grid dari <code>icon()</code> di studio-ui.html sebagai ID2D1PathGeometry.', 'Garis 1,5, ujung bulat, isian aksen 38%.'],
      done: 'tidak ada lagi Segoe Fluent / MDL2.', args: 'Ganti semua ikon Segoe Fluent dengan set ikon Studio sesuai rencana v3-studio Run 3.' })}
  </div>${thumbs([['ref-token', 'Token warna, font, radius, ikon'], ['ref-logo', 'Logo Bata (dipilih)']])}</div>
  ${folio('Fase 0–1')}</section>`;

const f2 = `<section class="page"><div class="eyebrow">Fase 2 · tampilan</div>
  <div class="split" style="margin-top:10px;grid-template-columns:1fr 470px"><div class="runs">
    ${runCard('4', { files: ['render.rs', 'geometry.rs', 'render_panel.rs', 'panel_layout.rs', 'settings.rs', 'settings_layout.rs', 'settings_controls.rs'],
      tasks: ['Notch: jam Fraunces It, cincin Pomodoro kecil, musik, lirik, notice badge 40 px.',
        'Kalender Bulan / Minggu / Hari (garis "sekarang").', 'Pomodoro: cincin besar, satu tombol utama.',
        'Pengingat: kelompok Hari ini / Besok, tag "Terlewat", ikon ulang.', 'Catatan: kartu 2 kolom.', 'Musik: sampul besar, tombol Lirik. Shortcuts: tile radius 18.',
        'Pengaturan: sidebar, kartu, segmen, toggle, stepper, 6 swatch aksen.', 'Radius: panel 30, tile 18, kartu 14, kontrol 10.'],
      done: 'screenshot <code>demo.rs</code> tiap halaman cocok dengan studio-ui.pdf hal. 3–12; test state & panel tetap hijau.',
      args: 'Restyle notch, ketujuh halaman panel (kecuali CLI) dan jendela pengaturan ke Studio sesuai rencana v3-studio Run 4.' })}
  </div><div class="thumbs" style="grid-template-columns:1fr 1fr">${[['ref-notch', 'Status notch'], ['ref-kalender', 'Kalender'], ['ref-pomodoro', 'Hari & Pomodoro'], ['ref-pengingat-catatan', 'Pengingat & Catatan'], ['ref-musik-cli', 'Musik'], ['ref-settings', 'Pengaturan']].map(([s, c]) => `<div><img src="img/${s}.png" alt="${c}"><div class="cap">${c}</div></div>`).join('')}</div></div>
  ${folio('Fase 2')}</section>`;

const f3 = `<section class="page"><div class="eyebrow">Fase 3 · editor baru</div>
  <div class="split" style="margin-top:10px"><div class="runs c3">
    ${runCard('5', { files: ['src/ui/editor.rs', 'i18n.rs'],
      tasks: ['Jendela tanpa bingkai; header, chip, toggle, segmen digambar Direct2D. Teks tetap <code>EDIT</code>.', 'Hapus DATETIMEPICK, <code>paint_themed</code>, <code>tone</code>.',
        'Popover kalender (grid panel) dan jam per 15 mnt.', 'Validasi jam; Simpan nonaktif tanpa judul; format tanggal dari i18n.', 'Keyboard lengkap; editor catatan ikut.'],
      done: 'tidak ada teks pelangi atau "10/26/2026".', args: 'Bangun ulang editor acara sesuai rencana v3-studio Run 5 dan editor-acara.pdf.' })}
    ${runCard('6', { files: ['src/ui/editor.rs'],
      tasks: ['Teks besar, chip tanggal & jam, segmen Sekali/Harian/Mingguan.', 'Kalimat ringkasan; Hapus hanya saat edit.', 'Tanggal lewat diredupkan.'],
      done: 'pengingat lama tetap bisa dibuka & disimpan.', args: 'Bangun ulang editor pengingat sesuai rencana v3-studio Run 6.' })}
    ${runCard('6b', { files: ['src/reminders.rs', 'src/ui/editor.rs'],
      tasks: ['Mingguan: beberapa hari (S S R K J S M).', 'Field hari opsional di reminders.json; data lama tetap terbaca.', 'Pintasan: 30 mnt lagi, 1 jam lagi, nanti malam, besok pagi.'],
      done: 'test file lama & baru, jadwal multi-hari, DST.', args: 'Tambah pilihan beberapa hari dan pintasan waktu sesuai rencana v3-studio Run 6b.' })}
  </div>${thumbs([['ref-editor-acara', 'Editor acara'], ['ref-editor-pengingat', 'Editor pengingat']])}</div>
  ${folio('Fase 3')}</section>`;

const f4 = `<section class="page"><div class="eyebrow">Fase 4 · CLI di dalam panel</div>
  <div class="split" style="margin-top:10px;grid-template-columns:1fr 420px"><div class="runs">
    ${runCard('7', { files: ['src/ui/window.rs', 'src/state.rs', 'render_panel.rs', 'panel_layout.rs', 'src/app.rs', 'src/ui/cli_window.rs (dihapus)'],
      tasks: ['Island boleh aktif selama input CLI dipakai (sekarang <code>WS_EX_NOACTIVATE</code>); dilepas saat Esc / klik di luar.',
        'Panel tidak menutup saat mouse keluar selama input aktif.', 'Input: satu <code>EDIT</code> tersembunyi (IME, paste, undo) digambar di panel. Enter, ↑↓, Tab, Ctrl+C, Esc.',
        'Output DM Mono mengalir dari bawah; roda mouse di output menggulir output, bukan pindah halaman.',
        'Chip: folder, shell, "Berjalan · 0:42" + Stop, hasil sage / "exit 1" merah lembut.', 'Saran riwayat di atas input; <code>cd</code> & <code>cls</code> tetap.',
        'Tombol perbesar 560 × 440.', 'Perintah tetap jalan saat panel ditutup; status di notch (berjalan, selesai 5 dtk, gagal sampai diklik).'],
