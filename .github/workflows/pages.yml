name: pages

# Publishes the static site/ folder (index, privacy, terms, style, img) to
# GitHub Pages. Pages can only serve the repo root or docs/ directly, so the
# site goes out through the GitHub Actions source instead.
# One-time owner step: Settings -> Pages -> Source: GitHub Actions.
on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
