name: release

# Pushing a tag like v2.0.0 builds the exe and publishes a GitHub release with:
#   vale.exe, vale.exe.sha256 (used by install.ps1)
#   vale-<tag>.zip (exe + install/uninstall scripts + README)
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      # Vale's own Google client ("Masuk dengan Google"), from the repository
      # secrets. Without them the build has no built-in client and Settings
      # shows only the own Client ID fields (src/google/client.rs).
      - name: Build
        env:
          VALE_GOOGLE_CLIENT_ID: ${{ secrets.VALE_GOOGLE_CLIENT_ID }}
          VALE_GOOGLE_CLIENT_SECRET: ${{ secrets.VALE_GOOGLE_CLIENT_SECRET }}
        run: cargo build --release --locked

      - name: Package
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          New-Item -ItemType Directory dist, pkg | Out-Null
          Copy-Item target/release/vale.exe dist/
          $hash = (Get-FileHash dist/vale.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path dist/vale.exe.sha256 -Value "$hash  vale.exe" -NoNewline -Encoding ascii
          Copy-Item dist/vale.exe, install.ps1, uninstall.ps1, README.md, LICENSE pkg/
          Compress-Archive -Path pkg/* -DestinationPath "dist/vale-$tag.zip"

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create '${{ github.ref_name }}' (Get-ChildItem dist).FullName --title '${{ github.ref_name }}' --generate-notes
